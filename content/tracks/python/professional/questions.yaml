- key: python-professional-01
  type: single
  category: python
  tags: [packaging, src-layout]
  prompt: |
    A project keeps its package in `src/tally/` instead of `tally/` next to `pyproject.toml`.
    Which mistake does this **src layout** help to catch?
  options:
    - text: A module left out of the wheel, because tests can only import the installed copy, not the folder in the project root
      correct: true
    - text: Slow imports, because Python searches `src/` before `site-packages`
    - text: Missing dependencies, because pip refuses to install a project without a `src/` folder
    - text: Name clashes between two installed packages, because `src/` gives every package its own namespace
  explanation: |
    Python puts the script's folder (or the current folder for `python -m` and the REPL) first on
    `sys.path`. In a flat layout, tests run from the project root therefore import the source
    folder directly, and they pass even when the built wheel lacks a module. In the src layout
    nothing importable sits in the root, so the code imports only after it is installed (usually
    with `pip install -e .`), and packaging mistakes show up in your own test run. The layout does
    not change import speed, is not required by pip, and does nothing about clashes between
    installed packages.

- key: python-professional-02
  type: multiple
  category: python
  tags: [packaging, pyproject, entry-points, versions]
  prompt: |
    Which statements about this `pyproject.toml` are true? Select all that apply.

    ```toml
    [project]
    name = "tally"
    version = "1.4.0"
    dependencies = ["rich ~= 13.7"]

    [project.scripts]
    tally = "tally.cli:main"

    [dependency-groups]
    test = ["pytest >= 8"]
    ```
  options:
    - text: "Installing the project creates a `tally` command that calls `tally.cli.main()` and uses its return value as the exit status"
      correct: true
    - text: "`rich ~= 13.7` accepts version 13.9 but not 14.0"
      correct: true
    - text: "Users who `pip install tally` from PyPI also get pytest, because it is listed in a dependency group"
    - text: "After `pip install -e .`, adding a second entry to `[project.scripts]` works without reinstalling"
  explanation: |
    `[project.scripts]` maps a command to `module:function`; the generated wrapper runs
    `sys.exit(main())`, so `None` or `0` means success. `~= 13.7` is a compatible-release
    specifier, the same as `>= 13.7, == 13.*`, so 13.9 is accepted and 14.0 is not. Dependency
    groups (PEP 735) are for working on the project and are never written into the published
    metadata, so users do not get pytest. An editable install makes code changes live, but
    metadata changes such as a new console script need `pip install -e .` again.

- key: python-professional-03
  type: single
  category: python
  tags: [testing, mock, patch]
  prompt: |
    `shop/billing.py` starts with `from shop.clock import now` and calls `now()` inside
    `make_invoice()`. A test wants `make_invoice()` to see a fixed time. Which `patch` target is
    right?
  options:
    - text: "`patch(\"shop.billing.now\")`"
      correct: true
    - text: "`patch(\"shop.clock.now\")`"
    - text: "`patch(\"now\")`"
    - text: "`patch(\"datetime.datetime.now\")`"
  explanation: |
    Patch a name **where it is looked up**. `from shop.clock import now` creates a second name,
    `now`, inside `shop.billing`, bound to the original function. Replacing `shop.clock.now`
    afterwards changes only the name in `shop.clock`; `make_invoice()` still calls the real
    function through its own name. `"now"` is not a full dotted path, and patching
    `datetime.datetime.now` fails because built-in types cannot have attributes set (and the code
    does not call it directly anyway). If `billing` had written `import shop.clock` and called
    `shop.clock.now()`, then `"shop.clock.now"` would be right.

- key: python-professional-04
  type: single
  category: python
  tags: [testing, mock, side-effect]
  prompt: |
    What does this print?

    ```python
    from unittest.mock import Mock

    fetch = Mock(side_effect=[TimeoutError("slow"), 1.08])
    for _ in range(2):
        try:
            print(fetch("EUR"))
        except TimeoutError as error:
            print("retry after", error)
    print(fetch.call_count)
    ```
  options:
    - text: "`retry after slow`, then `1.08`, then `2`"
      correct: true
    - text: "`TimeoutError('slow')`, then `1.08`, then `2`"
    - text: "`retry after slow`, then `retry after slow`, then `2`"
    - text: "`retry after slow`, then `1.08`, then `1`"
  explanation: |
    When `side_effect` is an iterable, each call takes the next item. An exception instance in the
    list is **raised**, not returned, so the first call raises `TimeoutError("slow")` and the loop
    prints `retry after slow`; the second call returns `1.08`. The mock records every call,
    including the one that raised, so `call_count` is 2. This is how you test retry logic without
    a real network.

- key: python-professional-05
  type: multiple
  category: python
  tags: [testing, pytest, unittest]
  prompt: |
    Which of these does **pytest** offer? Select all that apply.
  options:
    - text: "Plain `assert` statements that report both sides of a failed comparison"
      correct: true
    - text: "Fixtures that a test requests by naming them as parameters, with teardown after a `yield`"
      correct: true
    - text: "`@pytest.mark.parametrize`, which runs one test function once per row of values"
      correct: true
    - text: "Test discovery that ignores existing `unittest.TestCase` classes, so a project must rewrite them"
  explanation: |
    pytest rewrites `assert` statements so a failure shows the values and the expressions that
    produced them, injects fixtures by parameter name (code after `yield` is the teardown), and
    expands `parametrize` into one test per row, each reported separately. It also runs
    `unittest.TestCase` classes unchanged, so a project can switch runners first and rewrite tests
    gradually, or never.

- key: python-professional-06
  type: single
  category: python
  tags: [logging, levels, propagation]
  prompt: |
    What does this program write to standard error?

    ```python
    import logging

    logging.basicConfig(format="%(levelname)s:%(name)s:%(message)s")
    log = logging.getLogger("app.db")
    log.info("connected")
    log.warning("slow query")
    logging.getLogger("app").setLevel(logging.DEBUG)
    log.debug("rows=3")
    ```
  options:
    - text: "`WARNING:app.db:slow query` and then `DEBUG:app.db:rows=3`"
      correct: true
    - text: "Only `WARNING:app.db:slow query`, because `basicConfig` left the level at WARNING"
    - text: "All three messages, because `app.db` has no level of its own"
    - text: "Nothing, because the `app.db` logger has no handler"
  explanation: |
    `app.db` has no level, so it uses its nearest ancestor's. At first that is the root logger's
    default `WARNING`: `info` is dropped and `warning` is shown. After `app` is set to `DEBUG`,
    `app.db`'s effective level becomes `DEBUG`, so the `debug` call passes. The record then
    propagates to the root logger's handler, which `basicConfig` created with no level of its
    own, so it is printed. The logger itself needs no handler; propagation finds the root's.

- key: python-professional-07
  type: single
  category: python
  tags: [logging, libraries]
  prompt: |
    You are writing a library that other programs will import. How should it log?
  options:
    - text: "Use `logging.getLogger(__name__)` in each module, and at most add a `NullHandler` to the package's top logger"
      correct: true
    - text: "Call `logging.basicConfig(level=logging.INFO)` when the package is imported, so its messages are visible"
    - text: "Call `logging.info(...)` on the root logger, so applications receive the messages without configuration"
    - text: "Add a `StreamHandler` to the package's logger, so messages reach stderr even if the application forgets to configure logging"
  explanation: |
    Logging configuration belongs to the application. A library creates named loggers that follow
    its module structure and logs to them; the application decides levels, handlers and formats.
    `basicConfig` in a library changes the whole program's logging, logging to the root logger
    makes the library's messages impossible to filter by name, and a library's own handler causes
    duplicate lines once the application configures the root logger, because records propagate
    to both.

- key: python-professional-08
  type: single
  category: python
  tags: [cli, argparse, exit-status]
  prompt: |
    `tool.py` defines `parser.add_argument("--count", type=int, default=1)` and calls
    `parser.parse_args()`. What happens when you run `python tool.py --count x`?
  options:
    - text: "A usage line and `tool: error: argument --count: invalid int value: 'x'` go to stderr, and the exit status is 2"
      correct: true
    - text: "A `ValueError` traceback is printed and the exit status is 1"
    - text: "The error message goes to stdout and the exit status is 0, because the program handled it"
    - text: "`args.count` is `1`, because an invalid value falls back to the default"
  explanation: |
    `argparse` calls the `type` function on the text. When it raises `ValueError`, argparse turns
    that into a clean error message on stderr and exits with status 2, the Unix convention for a
    command-line usage error. Nothing reaches stdout, so a pipeline is not fed garbage, and the
    default is only used when the option is absent, never to paper over bad input.

- key: python-professional-09
  type: single
  category: python
  tags: [cli, sys-exit]
  prompt: |
    A script ends with `sys.exit(main())`, and `main()` returns the string `"disk full"` when
    there is no space left. What does the user see?
  options:
    - text: "`disk full` on standard error, and the exit status is 1"
      correct: true
    - text: "`disk full` on standard output, and the exit status is 0"
    - text: "A `TypeError`, because `sys.exit` accepts only integers"
    - text: "Nothing is printed, and the exit status is 1"
  explanation: |
    `sys.exit(arg)` raises `SystemExit`. An integer becomes the exit status and `None` means 0;
    any other object is printed to stderr and the status is 1. So `sys.exit("disk full")` is a
    quick way to fail with a message. For anything larger, log the error and return an integer
    status from `main`.

- key: python-professional-10
  type: single
  category: python
  tags: [json]
  prompt: |
    What does this print?

    ```python
    import json

    data = {1: ("a", "b")}
    back = json.loads(json.dumps(data))
    print(back, back == data)
    ```
  options:
    - text: "`{'1': ['a', 'b']} False`"
      correct: true
    - text: "`{1: ('a', 'b')} True`"
    - text: "`{1: ['a', 'b']} False`"
    - text: "It raises `TypeError`, because JSON cannot store tuples"
  explanation: |
    JSON object keys are always strings, so `dumps` writes the key `1` as `"1"`, and JSON has
    only one sequence type, the array, so the tuple is written as an array and comes back as a
    list. The result is `{'1': ['a', 'b']}`, which is not equal to the original. Tuples are
    accepted when encoding; types JSON has no form for at all, such as `Decimal` or `date`, are
    what raise `TypeError` unless you pass a `default` function.

- key: python-professional-11
  type: single
  category: python
  tags: [decimal, money, rounding]
  prompt: |
    What does this print?

    ```python
    from decimal import ROUND_HALF_UP, Decimal

    price = Decimal("2.675")
    cent = Decimal("0.01")
    print(price.quantize(cent), price.quantize(cent, rounding=ROUND_HALF_UP), round(2.675, 2))
    ```
  options:
    - text: "`2.68 2.68 2.67`"
      correct: true
    - text: "`2.67 2.68 2.68`"
    - text: "`2.68 2.68 2.68`"
    - text: "`2.67 2.68 2.67`"
  explanation: |
    `Decimal("2.675")` is exactly 2.675, a tie. The default rounding, `ROUND_HALF_EVEN`, sends a
    tie to the even last digit: 2.67 or 2.68, and 8 is even, so 2.68. `ROUND_HALF_UP` also gives
    2.68. The float literal `2.675` is really 2.67499999..., slightly below the tie, so
    `round(2.675, 2)` gives 2.67. That is why money is built from strings as `Decimal` and rounded
    with `quantize`.

- key: python-professional-12
  type: single
  category: python
  tags: [datetime, zoneinfo, dst]
  prompt: |
    Clocks in Berlin jump from 02:00 to 03:00 on 29 March 2026. What does this print?

    ```python
    from datetime import UTC, datetime, timedelta
    from zoneinfo import ZoneInfo

    start = datetime(2026, 3, 28, 12, 0, tzinfo=ZoneInfo("Europe/Berlin"))
    end = start + timedelta(days=1)
    print(end.strftime("%H:%M %Z"), end.astimezone(UTC) - start.astimezone(UTC))
    ```
  options:
    - text: "`12:00 CEST 23:00:00`"
      correct: true
    - text: "`13:00 CEST 1 day, 0:00:00`"
    - text: "`12:00 CET 1 day, 0:00:00`"
    - text: "`11:00 CEST 23:00:00`"
  explanation: |
    Adding a `timedelta` to an aware datetime is wall-clock arithmetic: the result is 12:00 on the
    next day, and `ZoneInfo` gives it the offset valid then, summer time (CEST, +02:00). Because
    one hour was skipped overnight, only 23 hours really passed, which the subtraction in UTC
    shows. To add an exact elapsed duration, convert to UTC, add, and convert back.

- key: python-professional-13
  type: single
  category: python
  tags: [asyncio, taskgroup]
  prompt: |
    Three tasks run in an `async with asyncio.TaskGroup() as group:` block. The second raises
    `ConnectionError` while the other two are still waiting. What happens?
  options:
    - text: "The group cancels the other two, waits for them to finish, then raises an `ExceptionGroup` containing the `ConnectionError`"
      correct: true
    - text: "The other two run to completion, and the `ConnectionError` is raised on its own afterwards"
    - text: "The `ConnectionError` is logged and ignored, and the block ends normally"
    - text: "The block exits at once with the `ConnectionError`, leaving the other two tasks running in the background"
  explanation: |
    A `TaskGroup` is structured concurrency: the first failure cancels the remaining tasks, the
    group waits until every task has ended (their `finally` blocks run), and then all failures are
    raised together in an `ExceptionGroup`, which `except* ConnectionError` can handle. No task
    outlives the block. `asyncio.gather` without `return_exceptions` behaves more like the last
    option: it raises the first exception but does not cancel the others.

- key: python-professional-14
  type: single
  category: python
  tags: [asyncio, gather, errors]
  prompt: |
    What does this print?

    ```python
    import asyncio


    async def job(n):
        await asyncio.sleep(0.01 * n)
        if n == 2:
            raise ValueError(n)
        return n


    async def main():
        results = await asyncio.gather(job(1), job(2), job(3), return_exceptions=True)
        print([type(result).__name__ for result in results])


    asyncio.run(main())
    ```
  options:
    - text: "`['int', 'ValueError', 'int']`"
      correct: true
    - text: "`['int', 'int']`"
    - text: "A traceback ending in `ValueError: 2`"
    - text: "`['int', 'int', 'ValueError']`"
  explanation: |
    With `return_exceptions=True`, `gather` lets every awaitable finish and puts an exception in
    the result list instead of raising it. Results keep the order of the arguments, not the order
    of completion, so the `ValueError` sits in the middle. Without the flag, the first exception
    would propagate out of `gather`.

- key: python-professional-15
  type: single
  category: python
  tags: [performance, profiling]
  prompt: |
    Which statement about the profilers in Python 3.15 is true?
  options:
    - text: "`profiling.sampling` inspects the program's stack from outside many times a second, has very low overhead, and can attach to a running process"
      correct: true
    - text: "`cProfile` was removed in 3.15; programs must switch to `profiling.tracing`"
    - text: "`profiling.tracing` estimates call counts from samples, so they are approximate"
    - text: "`profiling.sampling` needs a decorator on every function you want to measure"
  explanation: |
    PEP 799 created the `profiling` package. `profiling.sampling` is a new statistical profiler:
    it samples the call stack from outside, needs no code changes, adds almost no overhead,
    reports lines as well as functions, and can `attach` to a process by ID. `profiling.tracing`
    is the deterministic profiler formerly known as `cProfile`; it records every call, so its
    counts are exact. `cProfile` stays as an alias; it is the pure-Python `profile` module that is
    deprecated.

- key: python-professional-16
  type: single
  category: python
  tags: [performance, complexity, data-structures]
  prompt: |
    This function is slow on 100,000 orders. Why, and what is the fix?

    ```python
    def first_orders(orders):
        seen = []
        result = []
        for order in orders:
            if order.customer not in seen:
                seen.append(order.customer)
                result.append(order)
        return result
    ```
  options:
    - text: "`not in` on a list checks every item, so the loop is O(n²); make `seen` a `set`"
      correct: true
    - text: "`append` copies the whole list each time; preallocate `seen` with `[None] * len(orders)`"
    - text: "The `for` loop is slow in Python; rewrite it with `map` and `lambda`"
    - text: "Attribute access `order.customer` dominates; store it in a local variable first"
  explanation: |
    Membership in a list is O(n): Python compares the value with each item until it finds it. Done
    once per order, that makes the whole function O(n²). A `set` (or `dict`) hashes the value and
    finds it in O(1) on average, so the function becomes O(n). `append` is O(1) amortised, and the
    other micro-changes save little compared with fixing the algorithm, which a profiler would
    have shown at once.

- key: python-professional-17
  type: single
  category: python
  tags: [memory, copy]
  prompt: |
    What does this print?

    ```python
    import copy

    team = {"name": "night", "staff": ["ada"]}
    a = copy.copy(team)
    b = copy.deepcopy(team)
    team["staff"].append("bo")
    team["name"] = "day"
    print(a["name"], a["staff"], b["staff"])
    ```
  options:
    - text: "`night ['ada', 'bo'] ['ada']`"
      correct: true
    - text: "`day ['ada', 'bo'] ['ada']`"
    - text: "`night ['ada'] ['ada']`"
    - text: "`night ['ada', 'bo'] ['ada', 'bo']`"
  explanation: |
    `copy.copy` makes a new dict whose values are the **same** objects. Rebinding
    `team["name"]` changes only `team`, so `a` still says `night`, but appending to the shared
    list shows through `a["staff"]`. `copy.deepcopy` copied the list too, so `b["staff"]` is
    unaffected.

- key: python-professional-18
  type: single
  category: python
  tags: [memory, gc, reference-counting]
  prompt: |
    What does this print?

    ```python
    import gc
    import weakref


    class Node:
        pass


    a, b = Node(), Node()
    a.other, b.other = b, a
    weakref.finalize(a, print, "freed")
    del a, b
    print("deleted")
    gc.collect()
    print("end")
    ```
  options:
    - text: "`deleted`, then `freed`, then `end`"
      correct: true
    - text: "`freed`, then `deleted`, then `end`"
    - text: "`deleted`, then `end`, and `freed` never appears, because cycles leak"
    - text: "`deleted`, `end`, then `freed` only when the program exits"
  explanation: |
    `del a, b` removes the names, but each node still refers to the other, so neither reference
    count reaches zero and nothing is freed yet: `deleted` comes first. The cycle collector finds
    groups that only reference each other; `gc.collect()` runs it at once, the nodes are freed and
    the finaliser prints `freed` before `end`. Without the explicit call the collector would still
    have freed them on one of its automatic runs; cycles are freed late, not never.

- key: python-professional-19
  type: single
  category: python
  tags: [security, subprocess]
  prompt: |
    `name` comes from an uploaded file's name. Which call is safe?
  options:
    - text: "`subprocess.run([\"wc\", \"-c\", \"--\", name], capture_output=True, text=True, check=True)`"
      correct: true
    - text: "`subprocess.run(f\"wc -c {name}\", shell=True, capture_output=True, text=True)`"
    - text: "`subprocess.run(f\"wc -c '{name}'\", shell=True, capture_output=True, text=True)`"
    - text: "`os.system(\"wc -c \" + name)`"
  explanation: |
    With an argument list and no shell, `name` reaches `wc` as one argument whatever it contains,
    and `--` stops `wc` from reading a name such as `-l` as an option. With `shell=True` or
    `os.system`, a shell parses the line, so a name like `x; rm -rf ~` runs a second command.
    Wrapping the name in quotes does not help: a name containing `'` closes the quotes and the
    injection works again.

- key: python-professional-20
  type: multiple
  category: python
  tags: [security, secrets, passwords]
  prompt: |
    Which practices are right for a login system? Select all that apply.
  options:
    - text: "Create password-reset tokens with `secrets.token_urlsafe(32)`"
      correct: true
    - text: "Store `hashlib.scrypt(password, salt=..., n=2**17, r=8, p=1, maxmem=...)` with a random salt per user"
      correct: true
    - text: "Compare a submitted token with the stored one using `hmac.compare_digest`"
      correct: true
    - text: "Store `hashlib.sha256(password.encode()).hexdigest()`, since SHA-256 cannot be reversed"
  explanation: |
    `secrets` uses the operating system's cryptographic randomness; `random` is predictable from
    its state. Passwords need a slow, memory-hard hash with a per-user salt, which `scrypt`
    provides. `compare_digest` takes the same time however many leading characters match, so
    timing cannot leak the secret. A plain SHA-256 is not reversible, but it is fast: an attacker
    with the table tries billions of guesses a second, and without a salt equal passwords have
    equal hashes.

- key: python-professional-21
  type: single
  category: python
  tags: [quality, ruff, ci]
  prompt: |
    Your CI pipeline must fail when any file is not formatted, but must never change files
    itself. Which command does that?
  options:
    - text: "`ruff format --check .`"
      correct: true
    - text: "`ruff format .`"
    - text: "`ruff check --fix .`"
    - text: "`ruff check --select I .`"
  explanation: |
    `ruff format --check` writes nothing and exits with status 1 when any file would be
    reformatted, which fails the job. Plain `ruff format` rewrites the files and exits 0, so the
    check would always pass. `ruff check` is the linter, not the formatter: `--fix` changes files,
    and `--select I` only checks import order.

- key: python-professional-22
  type: single
  category: python
  tags: [quality, mypy, type-hints]
  prompt: |
    A module contains only this function, and `mypy` is run on it with its default settings.
    What does mypy report?

    ```python
    def describe(prices):
        return "items: " + len(prices)
    ```
  options:
    - text: "No errors, because mypy does not check the body of a function that has no annotations"
      correct: true
    - text: "An error, because `len` returns an `int` and the code adds it to a `str`"
    - text: "An error, because the function has no annotations"
    - text: "It cannot run, because mypy needs every function to be annotated"
  explanation: |
    By default mypy treats a function without annotations as dynamically typed and does not check
    its body, so an old codebase can adopt type checking gradually. The bug is real (calling the
    function raises `TypeError`), and `--check-untyped-defs` would report the `str + int`
    problem; `--disallow-untyped-defs`, part of `--strict`, would report the missing annotations.
    Annotating the function, `def describe(prices: list[str]) -> str:`, also makes mypy check it.
