    file: 02-emit-rules.ts
    hidden: true
  - name: Connects and disconnects a whole handler object
    file: 03-connect-handlers.ts
    hidden: true
  - name: Waits for the next event and stops waiting when the signal is aborted
    file: 04-next-and-abort.ts
    hidden: true
  - name: Derives exact types that reject misuse at compile time
