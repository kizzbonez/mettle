slug: playhouse-cue-bus
title: Playhouse Cue Bus
summary: Build a typed event bus for a theatre's show control, with payload and handler types derived from one event map, listeners that survive each other's failures, and a cancellable wait for the next cue.
language: typescript
minutes: 55
timeLimitMs: 5000
memoryMb: 256
