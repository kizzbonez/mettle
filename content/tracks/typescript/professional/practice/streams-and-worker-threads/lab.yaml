    file: 01-example.ts
    hidden: false
  - name: Splits lines across chunks and streams a season's log
    file: 02-lines-and-pipeline.ts
    hidden: true
  - name: Waits for drain and keeps the buffer at its high water mark
    file: 03-backpressure.ts
    hidden: true
  - name: Computes climbs in worker threads and reports their failures
    file: 04-worker.ts
    hidden: true
