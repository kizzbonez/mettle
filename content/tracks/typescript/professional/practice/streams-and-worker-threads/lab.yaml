title: Cycling Club Ride Logs
summary: Split stream chunks into lines with an async generator, stream a ride log through a pipeline, write to a slow stream that pushes back by waiting for drain, and move a CPU-heavy sum into a worker thread that loads the same file.
language: typescript
minutes: 20
timeLimitMs: 5000
memoryMb: 256
tests:
