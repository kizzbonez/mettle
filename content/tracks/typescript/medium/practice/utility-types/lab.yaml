    file: 01-example.ts
    hidden: false
  - name: Registers a new member from a draft without id or date joined
    file: 02-new-members.ts
    hidden: true
  - name: Applies only allowed changes and builds a card with two fields
    file: 03-changes-and-cards.ts
    hidden: true
  - name: Filters plan and event unions and reads fetchMember's result type
    file: 04-unions-and-functions.ts
    hidden: true
