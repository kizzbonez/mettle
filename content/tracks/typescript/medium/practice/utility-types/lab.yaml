title: Climbing Gym Members
summary: Derive the sign-up, profile edit and membership card versions of a member record with Omit, Partial, Pick and Record, filter unions with Exclude and Extract, read a function's result type with Awaited and ReturnType, and write the functions that use them.
language: typescript
minutes: 15
timeLimitMs: 5000
memoryMb: 256
tests:
