title: Car Park Gate
summary: Override Equals and GetHashCode so that a HashSet treats two spellings of a number plate as one car, and use a ref parameter to replace a struct the caller holds.
language: csharp
minutes: 12
timeLimitMs: 5000
memoryMb: 512
tests:
  - name: Works through the example from the instructions
    file: 01-example.cs
