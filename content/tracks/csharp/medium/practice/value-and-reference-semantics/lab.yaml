  - name: Compares plates by value and hashes them to match
    file: 02-equality.cs
    hidden: true
  - name: Lets each car in once and out again
    file: 03-car-park.cs
    hidden: true
  - name: Extends the caller's ticket and refuses bad minutes
    file: 04-extend.cs
    hidden: true
