title: Episode Queue
summary: Put a bounded channel between an uploader and slow transcoding workers, complete it when production ends, and let the workers share a ConcurrentDictionary so an episode uploaded twice is transcoded once.
language: csharp
minutes: 20
timeLimitMs: 5000
memoryMb: 512
tests:
  - name: Works through the example from the instructions
    file: 01-example.cs
    hidden: false
  - name: Makes the producer wait on a full queue and completes the writer
    file: 02-back-pressure.cs
    hidden: true
  - name: Transcodes each episode once across workers, even mid-transcode
    file: 03-once-per-episode.cs
    hidden: true
  - name: Runs the given number of workers at once and handles every upload
    file: 04-run.cs
    hidden: true
