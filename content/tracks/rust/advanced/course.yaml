title: Concurrency and Systems
summary: >-
  Shared ownership, interior mutability and the thread-safety rules the compiler enforces,
  followed by the model behind async code. The lab is a worker pool built from threads and
  channels.
outcomes:
  - Choose among `Box`, `Rc`, `Arc`, `RefCell` and `Mutex` for a given ownership problem
  - Share and send data between threads with `Arc<Mutex<T>>` and channels
  - Explain what `Send` and `Sync` mean and why a data race does not compile
  - Describe how a future is polled, woken and pinned, and what an executor does
  - Build a fixed-size worker pool that returns ordered results and shuts down cleanly
exam:
  title: Concurrency and Systems Mock Exam
  description: Five questions on interior mutability, threads, channels, `Send` and `Sync`, and async.
  timeLimitMinutes: 12
  passPercent: 70
