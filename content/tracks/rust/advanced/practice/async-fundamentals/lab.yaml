title: Watched Kettle
summary: Write a waker that counts its calls, a future with a hand-written poll that keeps the wake-up contract, and a tiny executor that polls a future to its end.
language: rust
minutes: 20
timeLimitMs: 5000
memoryMb: 256
tests:
  - name: Works through the example from the instructions
    file: 01-example.rs
    hidden: false
  - name: Counts wake-ups and keeps the kettle's promise to ask for one
    file: 02-waker-and-kettle.rs
    hidden: true
  - name: Drives futures to their end and counts the polls
    file: 03-drive-to-the-end.rs
    hidden: true
  - name: Stops when a future will never be woken
    file: 04-never-woken.rs
    hidden: true
