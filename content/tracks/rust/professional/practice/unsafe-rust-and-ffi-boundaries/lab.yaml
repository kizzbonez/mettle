title: Front Desk Kiosk
summary: Export a visitor log to C firmware with an opaque handle, C strings in both directions, status codes in place of panics, and every allocation returned to the side that made it.
language: rust
minutes: 20
timeLimitMs: 5000
memoryMb: 256
