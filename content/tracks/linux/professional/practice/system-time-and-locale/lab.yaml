title: One Timeline in UTC
summary: Merge log lines from servers in Manila, London and New York into one UTC timeline, letting date and TZ apply daylight saving time and half-hour offsets.
language: bash
minutes: 15
timeLimitMs: 5000
memoryMb: 128
tests:
  - name: Builds the UTC timeline of the sample events
    file: 01-example.sh
    hidden: false
  - name: Converts times on both sides of a daylight saving change
    file: 02-daylight-saving.sh
    hidden: true
  - name: Handles half-hour offsets and dates that change in UTC
    file: 03-offsets.sh
    hidden: true
  - name: Skips comments and keeps every message exactly as written
    file: 04-lines.sh
    hidden: true
