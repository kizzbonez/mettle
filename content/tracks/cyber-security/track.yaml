title: Cyber Security
tagline: Security+ (SY0-801) from first principles to security operations.
description: >-
  A full course in four levels aligned with the CompTIA Security+ SY0-801 (V8) exam objectives,
  covering all five domains: general security concepts and cryptography; threats,
  vulnerabilities and attacks; security architecture and controls; and security operations,
  governance, risk and compliance. Every level ends with a mock exam and a hands-on lab on real
  logs, configs, certificates and code in a sandbox, and a 90-question practice exam is drawn in
  the official domain weights. Mettle is not affiliated with or endorsed by CompTIA; Security+ is
  a trademark of CompTIA.
