# /etc/nginx/sites-enabled/tickets.encore.test
server {
    listen 443 ssl;
    http2 on;
    server_name tickets.encore.test;

    ssl_certificate     /etc/ssl/encore/tickets.pem;
    ssl_certificate_key /etc/ssl/encore/private/tickets.key;

    # ssl_protocols TLSv1.2 TLSv1.3;   hardening from 2024, rolled back during the box office outage
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:AES128-GCM-SHA256:DES-CBC3-SHA:RC4-SHA:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
