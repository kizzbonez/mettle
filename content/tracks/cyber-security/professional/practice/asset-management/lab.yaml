title: Library Asset Reconciliation
summary: Reconcile a library's asset inventory with DHCP and switch discovery data and with certificates of sanitization, reporting unknown, missing, retired-but-present and uncertified devices.
language: bash
minutes: 20
timeLimitMs: 5000
memoryMb: 128
tests:
  - name: Reconciles the sample files from the instructions
    file: 01-example.sh
    hidden: false
  - name: Matches MACs in any case and reports unknown, retired and missing devices once
    file: 02-discovery.sh
    hidden: true
  - name: Accepts only certificates that meet the sanitization rules
    file: 03-certificates.sh
    hidden: true
  - name: Handles a reconciled inventory and header-only files
    file: 04-clean-and-empty.sh
    hidden: true
