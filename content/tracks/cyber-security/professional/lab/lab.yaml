title: Ferry Line Vulnerability and Risk Report
summary: Turn a ferry operator's messy vulnerability scan, asset inventory, CISA KEV excerpt and five years of loss history into a remediation list ordered by known exploitation, exposure, criticality and CVSS with service-level due dates, then compute SLE, ARO and ALE for each stated risk and build the risk register summary the committee acts on.
language: python
minutes: 60
timeLimitMs: 10000
memoryMb: 512
