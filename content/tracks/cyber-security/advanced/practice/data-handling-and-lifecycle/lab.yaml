title: Retention Schedule and Legal Holds
summary: Apply a school trust's retention schedule to its records inventory in Bash, counting from creation or closure in days or years, and let active legal holds by record or category override disposal.
language: bash
minutes: 20
timeLimitMs: 5000
memoryMb: 128
tests:
  - name: Runs the sample disposal run from the instructions
    file: 01-example.sh
    hidden: false
  - name: Computes due dates from days, years, triggers and 29 February
    file: 02-periods-and-triggers.sh
    hidden: true
  - name: Applies active legal holds by record and category, first in file order
    file: 03-legal-holds.sh
    hidden: true
  - name: Sends unknown categories to review and handles an empty inventory
    file: 04-review-and-empty.sh
    hidden: true
