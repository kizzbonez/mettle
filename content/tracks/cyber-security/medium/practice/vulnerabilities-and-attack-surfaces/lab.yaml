title: Attack Surface Sweep
summary: Sweep a hotel group's asset inventory in Bash for unsupported, unpatched and unmanaged hosts, management ports exposed to the internet and assets with no owner, with exact date and port rules.
language: bash
minutes: 15
timeLimitMs: 5000
memoryMb: 128
tests:
  - name: Sweeps the sample inventory from the instructions
    file: 01-example.sh
    hidden: false
  - name: Applies the support and 30-day patch dates on their boundaries
    file: 02-dates.sh
    hidden: true
  - name: Reports only real management ports on internet-facing hosts, in order
    file: 03-ports.sh
    hidden: true
  - name: Handles Windows line endings, comments, a clean inventory and an empty one
    file: 04-format-and-clean.sh
    hidden: true
