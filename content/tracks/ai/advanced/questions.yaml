- key: ai-advanced-01
  type: single
  category: ai
  tags: [neural-networks, activation]
  prompt: |
    A network stacks three fully connected layers. By mistake, no activation function is applied
    between them:

    ```python
    def forward(x):
        return x @ W1 @ W2 @ W3
    ```

    What can this network learn?
  options:
    - text: Any function, provided the layers are wide enough
    - text: Nothing, because gradients cannot flow through layers that have no activation
    - text: Only what a single linear layer could learn, because a product of linear maps is itself one linear map
      correct: true
    - text: More than one layer but less than a network with activations, in proportion to its depth
  explanation: |
    `x @ W1 @ W2 @ W3` equals `x @ W`, where `W = W1 @ W2 @ W3`. However many matrices are
    multiplied, the result is one matrix, so the network can only draw the straight-line
    decision boundaries of a single layer. Adding biases does not change this.

    "Any function, given enough width" is the tempting answer. It misremembers the universal
    approximation result, which depends on a **nonlinearity** between the layers. Gradients flow
    through linear layers perfectly well, so the network does train. It simply cannot represent
    anything that is not linear, however long it trains.

- key: ai-advanced-02
  type: single
  category: ai
  tags: [transformer, attention, masking]
  prompt: |
    While training a decoder-only language model, a refactoring accidentally removes the causal
    mask from self-attention. Training loss drops to nearly zero within a few hundred steps.
    Text generated by the model is nonsense. What happened?
  options:
    - text: Each position could attend to the token it was supposed to predict, so the model learned to copy it; at generation time that token does not exist yet
      correct: true
    - text: Without the mask, softmax overflowed and filled the weights with NaN
    - text: The learning rate was too high, so the model overfit the training set
    - text: Position information is switched off when the mask is removed, so word order was lost
  explanation: |
    In next-token training, the target for position `t` is the token at position `t + 1`, and
    that token is part of the same input sequence. The causal mask is the only thing that hides
    it. Without the mask, attention can read the answer directly, and copying is far easier to
    learn than language. The loss collapses because the task has become trivial. During
    generation there is no future token to copy, and the model has learned nothing else.

    A loss near zero is the opposite of what NaN weights would produce. Overfitting would show
    as a growing gap between training and validation loss; here even validation loss would look
    excellent, because the leak is present there too. The mask and position information are
    independent mechanisms.

- key: ai-advanced-03
  type: true_false
  category: ai
  tags: [transformer, attention, position]
  prompt: |
    A single self-attention layer is given the token vectors for "dog bites man", and then
    separately for "man bites dog". No mask is used and no position information is added
    anywhere. The layer produces the same output vector for the token "dog" in both cases.
  options:
    - text: "True"
      correct: true
    - text: "False"
  explanation: |
    The output for a token is a weighted sum of the value vectors of all tokens. The weights
    depend only on the query of that token and the keys of the others, and none of these
    quantities knows where a token sits. Both sentences contain the same three vectors, so
    "dog" computes the same scores, the same weights and the same sum.

    This is why a transformer needs **position information**. Without it, the model sees a bag
    of tokens and cannot tell who bit whom. Note the conditions in the question: a causal mask
    would break the symmetry, because it makes what a token can see depend on where it is.

- key: ai-advanced-04
  type: multiple
  category: ai
  tags: [fine-tuning, rag, adaptation]
  prompt: |
    A legal-technology team wants an assistant that answers questions about its clients'
    contracts. Contracts are added and amended every day, and each answer must point to the
    clause it relied on. Which statements are correct? Select all that apply.
  options:
    - text: Retrieval suits this, because a new or amended contract is usable as soon as it has been indexed
      correct: true
    - text: Retrieval suits this, because the retrieved clause can be shown to the user as the source of the answer
      correct: true
    - text: Fine-tuning on the contracts is the better way to keep the assistant's knowledge current, because weights hold more than a prompt can
    - text: Fine-tuning could still be useful for a consistent answer format or tone, in combination with retrieval
      correct: true
  explanation: |
    The two requirements, **knowledge that changes daily** and **answers that cite a source**,
    both point to retrieval. An index can be updated in minutes, and the passage that was
    retrieved is the citation.

    Fine-tuning fails on both counts. Each amendment would need another training run, a
    superseded clause cannot be removed from the weights, and a fine-tuned model cannot say
    which document a statement came from. How much information weights can hold is beside the
    point.

    Fine-tuning changes behavior rather than supplying facts, so it remains a reasonable way
    to get a house style or a strict output format. The levers combine.

- key: ai-advanced-05
  type: single
  category: ai
  tags: [fine-tuning, overfitting, data-quality]
  prompt: |
    A team fine-tunes a model on 2,000 support conversations. To get more data, they first
    generate four paraphrases of every conversation, then shuffle all 10,000 examples and hold
    out 10% for validation.

    Training loss and validation loss fall together to very low values. In production, the
    model does badly on new conversations. What is the most likely explanation?
  options:
    - text: The model is underfitting; it should be trained for more epochs
    - text: Paraphrases of the same conversation are in both sets, so validation loss measures memorization; split by original conversation before augmenting
      correct: true
    - text: The learning rate is too low, which is why the two losses move together
    - text: Validation loss is not a meaningful signal for fine-tuning; only training loss should be watched
  explanation: |
    This is **leakage**. Because the split happened after augmentation, nearly every validation
    example has close relatives in the training set. The model can score well on validation by
    memorizing, so the validation loss no longer says anything about new conversations, and the
    overfitting that would normally show up as a rising validation loss is hidden.

    The fix is to split first, by original conversation, and augment only the training portion.

    Underfitting would show as high loss on both sets, not low loss. A validation set is
    exactly the right instrument for fine-tuning, but only while it stays independent of the
    training data.
