title: Hill Climb Timing Words
summary: Pack and unpack a hill-climb race's results with shifts and masks in Yul, find the highest passed gate with clz, revert with custom errors from assembly, and total times in a checked Yul loop over calldata, each fuzzed against a Solidity reference.
language: solidity
minutes: 20
timeLimitMs: 8000
memoryMb: 512
