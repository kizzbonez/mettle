title: Wood-Fired Pizza Counter
summary: Wait for the oven or for a context to end, give a bake its own deadline with a cause and always cancel it, and carry the order ticket through the context with an unexported key type.
language: go
minutes: 20
timeLimitMs: 5000
memoryMb: 768
tests:
