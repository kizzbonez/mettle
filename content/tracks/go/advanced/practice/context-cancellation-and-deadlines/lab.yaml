  - name: Waits for the pizza until the context is cancelled or times out
    file: 02-wait-for-pizza.go
    hidden: true
  - name: Gives the bake its own deadline, reports the cause and cancels it
    file: 03-bake-within.go
    hidden: true
  - name: Carries the ticket number in the context without key clashes
    file: 04-ticket.go
    hidden: true
